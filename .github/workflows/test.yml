name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      firebird:
        image: firebirdsql/firebird:5.0.3
        env:
          FIREBIRD_ROOT_PASSWORD: synthetic-test-only
          FIREBIRD_DATABASE: otel_review+1.fdb
        ports:
          - 3050:3050
        options: >-
          --health-cmd "/opt/firebird/bin/isql -user SYSDBA -password synthetic-test-only localhost:/var/lib/firebird/data/otel_review+1.fdb -q -i /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIREBIRD_TEST_DSN: SYSDBA:synthetic-test-only@localhost:3050/var/lib/firebird/data/otel_review+1.fdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install synthetic schema
        run: docker exec -i ${{ job.services.firebird.id }} /opt/firebird/bin/isql -b -user SYSDBA -password synthetic-test-only /var/lib/firebird/data/otel_review+1.fdb < testdata/firebird5/schema.sql
      # MON$ snapshots and first-use Profiler setup share one Firebird database.
      # Run packages sequentially to avoid cross-process server lock waits.
      - run: go test -race -p 1 ./...
      - run: go vet ./...
      - run: go test ./internal/sqltext -run '^$' -fuzz FuzzAnalyze -fuzztime 50000x -parallel 2
      - run: go test ./internal/traceparse -run '^$' -fuzz FuzzTraceChunks -fuzztime 50000x -parallel 2

  windows-platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify portable collector lifecycle
        run: go test ./trace -run 'TestRuntime|TestEventEncoding'
